[package]
name = "hares-nav"
# App/bundle version is read from ../package.json via tauri.conf.json.
version = "0.1.0"
description = "Hares-Panel — 本地优先的导航首页"
authors = ["Hares-Panel"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hares_nav_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
