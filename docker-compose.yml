services:
  hares-panel:
    build:
      context: .
      args:
        APK_MIRROR: ${APK_MIRROR:-}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: hares-panel:latest
    container_name: hares-panel
    restart: unless-stopped
    stop_grace_period: 20s
    # 默认映射写死成 18000:3000，NAS 面板（飞牛 / 群晖等）解析本文件时会直接
    # 预填这两个值；容器内固定监听 3000。要换宿主机端口，改这一行即可
    # （用 deploy.sh / deploy.ps1 时可用 --port / -Port，脚本会生成覆盖文件）。
    ports:
      - "18000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      HARES_RUNTIME: docker
      HARES_STATE_MAX_MB: ${HARES_STATE_MAX_MB:-16}
      HARES_ASSET_MAX_MB: ${HARES_ASSET_MAX_MB:-16}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
