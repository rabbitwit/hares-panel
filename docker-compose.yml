services:
  hares-panel:
    build:
      context: .
      args:
        APK_MIRROR: ${APK_MIRROR:-}
    image: hares-panel:latest
    container_name: hares-panel
    restart: unless-stopped
    stop_grace_period: 20s
    # Only the app port is published, on a high port that is unlikely to
    # collide with other NAS containers. Use your existing Nginx / Caddy /
    # router for public access or TLS termination.
    ports:
      - "${PANEL_PORT:-18000}:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      HARES_RUNTIME: docker
      HARES_STATE_MAX_MB: ${HARES_STATE_MAX_MB:-16}
      HARES_ASSET_MAX_MB: ${HARES_ASSET_MAX_MB:-16}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
