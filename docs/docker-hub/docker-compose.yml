# Hares-Panel - Docker Hub 拉取部署
#
# 使用前：
#   1. 把 image 改成实际的 Docker Hub 镜像，例如 yourname/hares-panel:latest；
#      或者在 .env 中设置 HARES_IMAGE=yourname/hares-panel:latest
#   2. 建议在 .env 中设置强密码 ADMIN_PASSWORD；
#      留空时容器首次启动会自动生成密码并保存到 ./data/admin-password
#   3. docker compose up -d
#
# 默认访问地址：http://<服务器IP>:18000

services:
  hares-panel:
    image: ${HARES_IMAGE:-your-dockerhub-name/hares-panel:latest}
    container_name: hares-panel
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "18000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      HARES_RUNTIME: docker
      HARES_STATE_MAX_MB: ${HARES_STATE_MAX_MB:-16}
      HARES_ASSET_MAX_MB: ${HARES_ASSET_MAX_MB:-16}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.APP_PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
